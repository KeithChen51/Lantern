<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>数据可视化参考库 · 地图</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens.css">
<script src="lieflat-theme.js"></script>
<script src="../runtime/echarts.min.js"></script>
<script src="../maps/usa.js"></script>
<script src="../maps/world.js"></script>
<style>
:root{--bg:var(--viz-editorial-c-f0efeb);--dark:var(--viz-editorial-c-1c1c1a);--ink:var(--viz-editorial-c-1c1c1a);--muted:var(--viz-editorial-c-8f8e88);--faint:var(--viz-editorial-c-c6c5bf);--grid:var(--viz-editorial-c-deddd6)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:var(--font-sans);color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1400px;margin:0 auto}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}
  .card.wide{grid-column:1/-1}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;
    padding:3px 10px;border-radius:99px;margin-bottom:10px;border:1px dashed var(--viz-editorial-c-b0afa9);color:var(--viz-editorial-c-8f8e88)}
  svg{width:100%;max-height:330px;display:block;margin:0 auto}
  svg text{font-family:var(--font-sans)}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){
    .pop,.fade{animation:none}
    .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
  }
  .pagehead{max-width:1400px;margin:0 auto 26px;padding:0 4px}
  .pagehead h1{font-size:22px;letter-spacing:-.02em;font-weight:800}
  .pagehead p{font-size:12px;color:var(--viz-editorial-c-8f8e88);margin-top:5px;line-height:1.7}
</style>
<style data-design-consultant-lieflat>
  html{background:var(--bg) !important}
  body{background:var(--bg) !important;color:var(--text) !important;font-family:var(--font-sans) !important}
  h1,h2,h3,.pagehead h1{font-family:var(--font-display) !important;letter-spacing:0 !important}
  svg text{font-family:var(--font-sans) !important}
  .sub,.src{color:var(--text-muted) !important}
  .card{border-radius:var(--radius-lg) !important;background:var(--bg) !important;color:var(--text) !important}
  .card.dark{background:var(--surface-inverse) !important;color:var(--text-inverse) !important}
  .card.dark .sub,.card.dark .src{color:color-mix(in srgb,var(--text-inverse) 62%,transparent) !important}
  .badge{border-radius:var(--radius-xs) !important}
  html[data-embedded="true"] .pagehead{display:none !important}
  .hit:focus{outline:none !important;stroke:var(--primary) !important;stroke-width:2 !important;stroke-opacity:1 !important}
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary) !important;outline-offset:2px !important}
  @media (max-width:900px){
    body{padding:20px !important}
    .grid2{grid-template-columns:minmax(0,1fr) !important;gap:18px !important;width:100% !important;min-width:0 !important}
    .card.wide{grid-column:auto !important}
    .card{padding:24px 20px 18px !important;min-width:0 !important;overflow-x:auto !important;overscroll-behavior-inline:contain;touch-action:pan-x pan-y pinch-zoom}
    .split{grid-template-columns:minmax(0,1fr) !important;gap:18px !important;min-width:0 !important}
    .card>svg{width:720px !important;max-width:none !important}
    .ch,.wrap{width:720px !important;max-width:none !important;height:420px !important}
    #ch{width:1140px !important;max-width:none !important;height:640px !important;min-height:640px !important}
    canvas{max-width:none !important}
    .pagehead{margin-bottom:18px !important}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important}
  }
</style>
<style>
  .map-replay{min-height:40px;margin-top:8px;padding:7px 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--primary-text);font:600 13px var(--font-sans);cursor:pointer}
  .card:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
  .ch{min-width:0}
</style>
</head>
<body>
<nav class="gallery-nav" aria-label="图库导航"><a href="../index.html#maps">← 返回图表目录</a><span>地图 · 示例数据</span></nav>
<div class="pagehead">
  <h1>地图 · 2 个参考模板</h1>
  <p>用于地域分布分析。州和国家的面积表示地理大小，颜色深浅表示示例数量。地图轮廓和运行库均可离线读取。</p>
</div>
<div class="grid2">
  <!-- M1 · US Choropleth -->
  <div class="card" id="M1">
    <span class="badge">地图 · 美国州级分布</span>
    <h2>美国各州注册用户分布</h2>
    <div class="sub">真实轮廓 · 阿拉斯加和夏威夷置于左下角 · 颜色深浅表示注册人数，分为五档</div>
    <div class="ch" id="mapus" style="height:340px" role="img" aria-label="美国各州注册用户分布，示例数据。加州 96 千人，纽约州 78 千人，得克萨斯州 72 千人。"></div>
    <div class="src">分级设色图 · 美国州级 · 注册人数</div>
  </div>

  <!-- M2 · World Choropleth -->
  <div class="card wide" id="M2">
    <span class="badge">地图 · 世界国家分布</span>
    <h2>全球月活跃账户分布</h2>
    <div class="sub">真实轮廓 · 颜色深浅表示月活跃账户数 · 浅灰色表示尚未开放的市场</div>
    <div class="ch" id="mapworld" style="height:400px" role="img" aria-label="全球月活跃账户分布，示例数据。美国 95 千，印度 62 千，英国 48 千，德国 41 千，巴西 39 千。"></div>
    <div class="src">分级设色图 · 世界国家级 · 月活跃账户</div>
  </div>
</div>
<script>
const C=window.DC_LIEFLAT_COLORS;
const FONT_FAMILY=getComputedStyle(document.documentElement).getPropertyValue("--font-sans").trim()||"sans-serif";
const INK=C["1C1C1A"],PAPER=C["F0EFEB"],MUTED=C["8F8E88"],GRID=C["DEDDD6"];
const T=window.DC_LIEFLAT_THEME;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>fn(n);
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
  const replay=document.createElement('button');
  replay.type='button';
  replay.className='map-replay';
  replay.textContent='重播地图';
  replay.setAttribute('aria-label','重播'+n.closest('.card').querySelector('h2').textContent);
  replay.addEventListener('click',go);
  n.insertAdjacentElement('afterend',replay);
};

// ════ M1 · US choropleth ════
// 真轮廓地图：ECharts registerMap + GeoJSON（ECharts 官方示例数据，jsdelivr）。
// 阿拉斯加/夏威夷/波多黎各用 registerMap 第三参 specialAreas 收进左下角
// （官方 USA 示例同款，零额外依赖；d3 albersUsa 投影方案在部分环境渲染空白，弃用）。
// Mono 化三件事：piecewise 五档灰阶 visualMap（明度即数据）、
// 纸色描边当州界发丝、无数据州留 #E4E3DC（沉默可见）。
// 面积失真的坦白：州的大小是地理，不是数值（蒙大拿大 ≠ 蒙大拿多）。
// ⚠️ 如果换成中国地图：数据源必须含台湾省 + 南海诸岛 + 九段线
// （用 DataV GeoAtlas 100000_full 或其完整镜像），发布前核对当期审图号。
const MAP_LEGEND={
  contentColor:T.accent,outOfRange:{color:GRID},
  itemWidth:11,itemHeight:11,itemSymbol:'rect',
  textStyle:{fontFamily:FONT_FAMILY,fontSize:9,color:C["8F8E88"]},
  inRange:{color:[T.accentSubtle,T.accentSoft,T.accentMid,T.accent,T.accentStrong]},
};
(()=>{
const D={'California':96,'New York':78,'Texas':72,'Washington':68,'Massachusetts':66,
  'Florida':54,'Illinois':49,'Colorado':44,'Georgia':41,'Virginia':33,'Pennsylvania':31,
  'North Carolina':30,'New Jersey':28,'Oregon':22,'Ohio':21,'Michigan':19,'Arizona':18,
  'Minnesota':16,'Utah':15,'Maryland':14,'Tennessee':13,'Wisconsin':12,'Missouri':11,
  'Indiana':9,'Nevada':8,'Connecticut':7,'South Carolina':6,'Alabama':5,'Kentucky':5,
  'Oklahoma':4,'Iowa':4,'Kansas':3,'Arkansas':3,'Louisiana':3,'New Hampshire':2,
  'Idaho':2,'New Mexico':2,'Hawaii':2,'Maine':1,'Nebraska':1,'Alaska':1};
{
    const geo = window.LH_MAP_DATA.usa;
    echarts.registerMap('mono-usa',geo,{
      Alaska:{left:-131,top:25,width:15},
      Hawaii:{left:-110,top:28,width:5},
      'Puerto Rico':{left:-76,top:26,width:2},
    });
    const opt={
      color:["#d97706","#9b7a4c","#2c2c2c","#9b5c14","#e09943","#806744","#e7b87c","#5e5d59","#edd1aa"],
      animation:!matchMedia('(prefers-reduced-motion: reduce)').matches,
      animationDuration:900,animationEasing:'quarticOut',
      tooltip:{backgroundColor:INK,borderWidth:0,padding:[10,14],
        textStyle:{color:PAPER,fontFamily:FONT_FAMILY,fontSize:12},
        formatter:p=>isNaN(p.value)?p.name+' — 暂无数据':p.name+' — '+p.value+' 千人注册'},
      visualMap:{type:'piecewise',bottom:6,left:'center',orient:'horizontal',
        pieces:[{max:9,label:'≤9 千'},{min:10,max:20,label:'10–20 千'},{min:21,max:38,label:'21–38 千'},
          {min:39,max:64,label:'39–64 千'},{min:65,label:'≥65 千'}],
        ...MAP_LEGEND},
      series:[{type:'map',map:'mono-usa',top:10,bottom:48,
        itemStyle:{areaColor:C["E4E3DC"],borderColor:PAPER,borderWidth:1},
        emphasis:{label:{show:true,fontFamily:FONT_FAMILY,fontSize:10,fontWeight:800,color:INK,
          textBorderColor:PAPER,textBorderWidth:3},
          itemStyle:{areaColor:null,borderColor:INK,borderWidth:1.2}},
        select:{disabled:true},
        data:Object.entries(D).map(([n,v])=>({name:n,value:v,
          label:n==='California'?{show:true,formatter:'加州 96 千',fontFamily:FONT_FAMILY,fontSize:9,
            fontWeight:800,color:PAPER,textBorderColor:INK,textBorderWidth:2}:undefined})),
      }],
    };
    obsReveal('mapus',elDom=>{
      const g=echarts.getInstanceByDom(elDom)||echarts.init(elDom,null,{renderer:'svg'});
      g.clear();g.setOption(opt);
    });
  }
})();

// ════ M2 · World choropleth ════
// 世界真轮廓版。同一套 Mono 化规则；用 boundingCoords 裁掉南极，
// 关键市场（≥39k）直接把数值标在版图上。
(()=>{
const D={'United States':95,'India':62,'United Kingdom':48,'Germany':41,'Brazil':39,'Canada':34,
  'France':30,'Australia':28,'China':26,'Japan':26,'Korea':21,'Spain':19,'Italy':17,'Singapore':16,
  'Indonesia':15,'Mexico':14,'Netherlands':13,'Poland':13,'Sweden':12,'Ireland':12,'Philippines':11,
  'Turkey':10,'Vietnam':9,'South Africa':9,'Denmark':9,'Norway':8,'Thailand':8,'Malaysia':8,
  'United Arab Emirates':8,'Argentina':7,'Finland':7,'Nigeria':7,'Chile':6,'Colombia':6,
  'Saudi Arabia':6,'Ukraine':6,'New Zealand':6,'Egypt':5,'Pakistan':5,'Russia':5,'Portugal':5,
  'Greece':4,'Kenya':4,'Peru':4,'Morocco':3,'Iceland':2,'Iran':2,'Kazakhstan':2,'Ethiopia':2,
  'Ghana':2,'Ecuador':2,'Algeria':2,'Mongolia':1,'Libya':1};
const BIG={'United States':['美国 95 千',[0,0]],'India':['印度 62 千',[0,4]],
  'United Kingdom':['英国 48 千',[-26,-12]],'Germany':['德国 41 千',[26,14]],'Brazil':['巴西 39 千',[0,0]]};
{
    const geo = window.LH_MAP_DATA.world;
    echarts.registerMap('mono-world',geo);
    const opt={
      color:["#d97706","#9b7a4c","#2c2c2c","#9b5c14","#e09943","#806744","#e7b87c","#5e5d59","#edd1aa"],
      animation:!matchMedia('(prefers-reduced-motion: reduce)').matches,
      animationDuration:900,animationEasing:'quarticOut',
      tooltip:{backgroundColor:INK,borderWidth:0,padding:[10,14],
        textStyle:{color:PAPER,fontFamily:FONT_FAMILY,fontSize:12},
        formatter:p=>isNaN(p.value)?p.name+' — 尚未开放':p.name+' — '+p.value+' 千月活跃账户'},
      visualMap:{type:'piecewise',bottom:2,left:'center',orient:'horizontal',
        pieces:[{max:9,label:'≤9 千'},{min:10,max:20,label:'10–20 千'},{min:21,max:38,label:'21–38 千'},
          {min:39,max:64,label:'39–64 千'},{min:65,label:'≥65 千'}],
        ...MAP_LEGEND},
      series:[{type:'map',map:'mono-world',top:4,bottom:36,
        boundingCoords:[[-170,76],[190,-58]],   // crop antarctica
        itemStyle:{areaColor:C["E4E3DC"],borderColor:PAPER,borderWidth:.7},
        emphasis:{label:{show:true,fontFamily:FONT_FAMILY,fontSize:10,fontWeight:800,color:INK,
          textBorderColor:PAPER,textBorderWidth:3},
          itemStyle:{areaColor:null,borderColor:INK,borderWidth:1.1}},
        select:{disabled:true},
        data:Object.entries(D).map(([n,v])=>({name:n,value:v,
          label:BIG[n]?{show:true,formatter:BIG[n][0],offset:BIG[n][1],fontFamily:FONT_FAMILY,fontSize:8.5,
            fontWeight:800,color:INK,textBorderColor:PAPER,textBorderWidth:3}:undefined})),
      }],
    };
    obsReveal('mapworld',elDom=>{
      const g=echarts.getInstanceByDom(elDom)||echarts.init(elDom,null,{renderer:'svg'});
      g.clear();g.setOption(opt);
    });
  }
})();

addEventListener('resize',()=>{
  ['mapus','mapworld'].forEach(id=>echarts.getInstanceByDom(document.getElementById(id))?.resize());
});
</script>
</body>
</html>
